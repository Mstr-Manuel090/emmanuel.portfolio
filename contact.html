<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Contact Emmanuel</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        font-family: "Outfit", sans-serif;
      }

      body {
        background: #050816;
        overflow-x: hidden;
      }

      .glow {
        position: absolute;
        width: 500px;
        height: 500px;
        background: rgba(249, 115, 22, 0.2);
        filter: blur(150px);
        border-radius: 50%;
        top: -100px;
        right: -100px;
        z-index: -1;
      }
    </style>
  </head>

  <body
    class="text-white min-h-screen flex items-center justify-center px-6 relative"
  >
    <div class="glow"></div>

    <div
      class="w-full max-w-2xl bg-white/5 border border-white/10 backdrop-blur-xl rounded-[40px] p-10"
    >
      <div class="mb-10 text-center">
        <h1 class="text-5xl font-black mb-4">Let's Work Together</h1>

        <p class="text-gray-400 leading-8">
          Send me a message and I'll get back to you shortly.
        </p>
      </div>
      <form id="contact-form" class="space-y-6">
        <!-- Disable Captcha -->
        <!-- <input type="hidden" name="_captcha" value="false" />

        <input
          type="hidden"
          name="access_key"
          value="4d43a359-ea26-4e21-b9cf-b44226a5f935"
        />

        Email Subject
        <input type="hidden" name="_subject" value="New Portfolio Message" />

        Template
        <input type="hidden" name="_template" value="table" />
<!-- 
        Redirect After Submit -->
        <!-- <input type="hidden" name="_next" value="thankyou.html" /> -->

        <!-- Name -->
        <input
          type="text"
          name="name"
          placeholder="Your Name"
          required
          class="w-full bg-black/30 border border-white/10 rounded-2xl px-5 py-4 outline-none focus:border-orange-500"
        />

        <!-- Email -->
        <input
          type="email"
          name="email"
          placeholder="Your Email"
          required
          class="w-full bg-black/30 border border-white/10 rounded-2xl px-5 py-4 outline-none focus:border-orange-500"
        />

        <!-- Message -->
        <textarea
          name="message"
          rows="6"
          placeholder="Your Message"
          required
          class="w-full bg-black/30 border border-white/10 rounded-2xl px-5 py-4 outline-none focus:border-orange-500 resize-none"
        ></textarea>

        <!-- Button -->
        <button
          type="submit"
          id="send-btn"
          class="w-full bg-orange-500 hover:bg-orange-600 transition py-5 rounded-2xl font-semibold text-lg"
        >
          <span id="btn-text"> Send Message </span>
          <!-- Loader -->
          <span
            id="spinner"
            class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"
          ></span>
        </button>
      </form>
    </div>

    <div
      id="toast"
      class="fixed bottom-6 right-6 px-5 py-3 rounded-xl text-white opacity-0 transition-all duration-300"
    ></div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script>
      emailjs.init("Gn10QQ8cQCeTzcQaG");

      const form = document.getElementById("contact-form");
      const toast = document.getElementById("toast");
      const btn = document.getElementById("send-btn");
      const spinner = document.getElementById("spinner");
      const btnText = document.getElementById("btn-text");

      function showToast(message, type) {
        toast.textContent = message;

        toast.className =
          "fixed bottom-6 right-6 px-5 py-3 rounded-xl text-white transition-all duration-300 " +
          (type === "success"
            ? "bg-green-500 opacity-100"
            : "bg-red-500 opacity-100");

        setTimeout(() => {
          toast.className =
            "fixed bottom-6 right-6 px-5 py-3 rounded-xl text-white opacity-0 transition-all duration-300";
        }, 3000);
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        // loading state
        if (!btn) {
          console.error("button not found - check your HTML ID");
          return;
        }
        btn.disabled = true;
        spinner.classList.remove("hidden");
        btnText.textContent = "Sending...";

        emailjs
          .sendForm("service_r2ib994", "template_zp7uaqi", form)
          .then(() => {
            showToast("Message sent successfully 🚀", "success");
            form.reset();
          })
          .catch((err) => {
            console.log(err);
            showToast("Message failed ❌", "error");
          })
          .finally(() => {
            btn.disabled = false;
            spinner.classList.add("hidden");
            btnText.textContent = "Send Message";
          });
      });
    </script>
  </body>
</html>
